# ==============================================================================
# NetworkManager Shared Mode dnsmasq configuration for ICarMeter Hotspot
# Location: /etc/NetworkManager/dnsmasq-shared.d/icarmeter.conf
# ==============================================================================

# Custom domain resolution
address=/icarmeter.local/192.169.204.145
address=/icarmeter/192.169.204.145

# DHCP IP Range & Lease Time (cấp phát nhanh, ổn định cho thiết bị di động trên xe)
dhcp-range=192.169.204.150,192.169.204.220,255.255.255.0,12h

# DHCP authoritative: lập tức phản hồi yêu cầu DHCP của điện thoại mà không chờ timeout
dhcp-authoritative

# Cung cấp DNS server trỏ thẳng về Pi (192.169.204.145)
dhcp-option=6,192.169.204.145

# Giới hạn số lượng client và khoanh vùng local domain
dhcp-lease-max=50
local=/local/
domain=icarmeter.local
