# ==============================================================================
# NetworkManager Shared Mode dnsmasq configuration for ICarMeter Hotspot
# Location: /etc/NetworkManager/dnsmasq-shared.d/icarmeter.conf
# ==============================================================================

# Custom domain resolution
address=/icarmeter.local/192.168.4.1
address=/icarmeter/192.168.4.1

# Resolve captive portal checks directly to Pi wlan0 IP so phones get instant
# HTTP responses and do not drop Wi-Fi or fall back to cellular data
address=/connectivitycheck.gstatic.com/192.168.4.1
address=/clients3.google.com/192.168.4.1
address=/play.googleapis.com/192.168.4.1
address=/connectivitycheck.android.com/192.168.4.1
address=/captive.apple.com/192.168.4.1
address=/www.apple.com/192.168.4.1
address=/msftconnecttest.com/192.168.4.1
address=/ipv6.msftconnecttest.com/192.168.4.1

# DHCP options to ensure clean IP and DNS distribution
dhcp-option=option:router,192.168.4.1
dhcp-option=option:dns-server,192.168.4.1
dhcp-lease-max=50
dhcp-authoritative
