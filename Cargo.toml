[package]
name = "icarmeter"
# CI replaces this bootstrap value with the version selected for each build.
version = "0.0.0"
edition = "2024"

[dependencies]
fontdue = "0.9.4"
libc = "0.2.190"
memmap2 = "0.9.11"
tiny-skia = "0.12.0"
maplibre_native = { version = "0.10.0", default-features = false, features = ["opengl", "json", "log"] }
serde_json = "1"
url = "2"
zbus = { version = "4", default-features = false, features = ["blocking", "async-io"] }
