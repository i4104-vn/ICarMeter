[package]
name = "icarmeter"
# CI replaces this bootstrap value with the version selected for each build.
version = "0.0.0"
edition = "2024"

[dependencies]
libc = "0.2.190"
serde_json = "1"
slint = { version = "1.18.1", default-features = false, features = ["backend-linuxkms", "renderer-software", "compat-1-2"] }

[build-dependencies]
slint-build = "1.18.1"

[profile.release]
strip = "symbols"
