name: Build Android Companion APK

on:
  push:
    paths:
      - "mobile-app/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build ICarMeter Companion APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Sync latest web assets into Android project
        run: |
          mkdir -p mobile-app/android/app/src/main/assets
          cp -rf mobile-app/www/* mobile-app/android/app/src/main/assets/

      - name: Build Debug APK with Gradle
        working-directory: mobile-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Verify generated APK
        run: |
          ls -lah mobile-app/android/app/build/outputs/apk/debug/
          cp mobile-app/android/app/build/outputs/apk/debug/app-debug.apk ICarMeter-Companion.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: icarmeter-companion-apk
          path: ICarMeter-Companion.apk
          if-no-files-found: error
          retention-days: 14
