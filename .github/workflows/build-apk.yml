name: Build Android Companion APK

on:
  push:
    paths:
      - "mobile-app/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build ICarMeter Companion APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Sync latest web assets into Android project
        run: |
          mkdir -p mobile-app/android/app/src/main/assets
          cp -rf mobile-app/www/* mobile-app/android/app/src/main/assets/

      - name: Build Debug APK with Gradle
        working-directory: mobile-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Verify and organize generated APKs
        run: |
          mkdir -p dist-apks
          OUTPUT_DIR="mobile-app/android/app/build/outputs/apk/debug"
          ls -lah "$OUTPUT_DIR"

          # Universal APK (both 32-bit and 64-bit compatible)
          if [ -f "$OUTPUT_DIR/app-universal-debug.apk" ]; then
            cp "$OUTPUT_DIR/app-universal-debug.apk" dist-apks/ICarMeter-Universal.apk
            cp "$OUTPUT_DIR/app-universal-debug.apk" dist-apks/ICarMeter-Companion.apk
          fi

          # 64-bit ARM (arm64-v8a)
          if [ -f "$OUTPUT_DIR/app-arm64-v8a-debug.apk" ]; then
            cp "$OUTPUT_DIR/app-arm64-v8a-debug.apk" dist-apks/ICarMeter-arm64-v8a.apk
          fi

          # 32-bit ARM (armeabi-v7a)
          if [ -f "$OUTPUT_DIR/app-armeabi-v7a-debug.apk" ]; then
            cp "$OUTPUT_DIR/app-armeabi-v7a-debug.apk" dist-apks/ICarMeter-armeabi-v7a.apk
          fi

          # Fallback if standard unsplit apk was generated
          if [ -f "$OUTPUT_DIR/app-debug.apk" ]; then
            cp "$OUTPUT_DIR/app-debug.apk" dist-apks/ICarMeter-Companion.apk
          fi

          echo "Listing packaged APK files:"
          ls -lah dist-apks/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: icarmeter-companion-apk
          path: dist-apks/*.apk
          if-no-files-found: error
          retention-days: 14
