name: Build Android Companion APK

on:
  push:
    paths:
      - "mobile-app/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build ICarMeter Companion APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"

      - name: Sync latest web assets into Android project
        run: |
          mkdir -p mobile-app/android/app/src/main/assets
          cp -rf mobile-app/www/* mobile-app/android/app/src/main/assets/

      - name: Build Debug APK with Gradle
        working-directory: mobile-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Package Single Universal APK
        run: |
          OUTPUT_APK="mobile-app/android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$OUTPUT_APK" ]; then
            cp "$OUTPUT_APK" ICarMeter.apk
            ls -lah ICarMeter.apk
          else
            echo "ERROR: $OUTPUT_APK not found!" >&2
            exit 1
          fi

      - name: Upload Single APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ICarMeter-APK
          path: ICarMeter.apk
          if-no-files-found: error
          retention-days: 14
