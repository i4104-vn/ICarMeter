name: Build & Release ICarMeter (OS Image & Android APK)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Application version (e.g. 1.2.3 or 1.2.3-rc.1)"
        required: true
        type: string
      tag_name:
        description: "Release Tag (e.g. v1.0.0)"
        required: false
        default: ""
        type: string
      release_name:
        description: "Release Title (e.g. ICarMeter v1.0.0)"
        required: false
        default: ""
        type: string
      draft:
        description: "Create Draft Release"
        required: false
        default: false
        type: boolean
      prerelease:
        description: "Mark as Pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  # Resolve one version for Flutter, Cargo, and the release tag.
  resolve-version:
    name: Resolve build version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Resolve and validate version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
          GIT_REF: ${{ github.ref }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="${INPUT_VERSION#v}"
          elif [ -n "$INPUT_TAG_NAME" ]; then
            VERSION="${INPUT_TAG_NAME#v}"
          elif [[ "$GIT_REF" == refs/tags/* ]]; then
            VERSION="${GIT_REF#refs/tags/}"
            VERSION="${VERSION#v}"
          else
            echo "Enter a version in the workflow's version input (for example 1.2.3)." >&2
            exit 1
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version '$VERSION'. Use semantic versioning, for example 1.2.3 or 1.2.3-rc.1." >&2
            exit 1
          fi

          if [ -n "$INPUT_TAG_NAME" ]; then
            TAG_VERSION="${INPUT_TAG_NAME#v}"
            if [ "$TAG_VERSION" != "$VERSION" ]; then
              echo "Release tag '$INPUT_TAG_NAME' does not match version '$VERSION'." >&2
              exit 1
            fi
            TAG="$INPUT_TAG_NAME"
          elif [[ "$GIT_REF" == refs/tags/* ]]; then
            TAG="${GIT_REF#refs/tags/}"
            TAG_VERSION="${TAG#v}"
            if [ "$TAG_VERSION" != "$VERSION" ]; then
              echo "Git tag '$TAG' does not match version '$VERSION'." >&2
              exit 1
            fi
          else
            TAG="v${VERSION}"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION (release tag $TAG)"

  # ==============================================================================
  # Job 1: Build Android Companion APK (Flutter - Universal x32 & x64)
  # ==============================================================================
  build-apk:
    name: Build Android Companion APK (Flutter)
    needs: [resolve-version]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set Flutter app version
        working-directory: mobile-app
        env:
          APP_VERSION: ${{ needs.resolve-version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re

          pubspec = Path("pubspec.yaml")
          contents = pubspec.read_text()
          version_line = f"version: {os.environ['APP_VERSION']}+{os.environ['BUILD_NUMBER']}"
          if re.search(r"(?m)^version:\s*", contents):
              contents = re.sub(r"(?m)^version:\s*.*$", version_line, contents, count=1)
          else:
              contents = re.sub(r"(?m)^environment:", version_line + "\n\nenvironment:", contents, count=1)
          pubspec.write_text(contents)
          print(f"Building Flutter app version {version_line.removeprefix('version: ')}")
          PY

      - name: Get Flutter Dependencies
        working-directory: mobile-app
        run: flutter pub get

      - name: Release APK
        working-directory: mobile-app
        env:
          APP_VERSION: ${{ needs.resolve-version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: flutter build apk --release --split-per-abi --build-name "$APP_VERSION" --build-number "$BUILD_NUMBER"

      - name: Package Release APKs
        run: |
          mkdir -p apk_dist
          V8A_APK=$(find mobile-app/build/app/outputs/flutter-apk -name "*arm64-v8a*release*.apk" 2>/dev/null | head -n 1)
          V7A_APK=$(find mobile-app/build/app/outputs/flutter-apk -name "*armeabi-v7a*release*.apk" 2>/dev/null | head -n 1)

          if [ -f "$V8A_APK" ]; then
            cp -v "$V8A_APK" apk_dist/ICarMeter-arm64-v8a.apk
            cp -v "$V8A_APK" apk_dist/ICarMeter.apk
            echo "Packaged v8a APK -> apk_dist/ICarMeter-arm64-v8a.apk and apk_dist/ICarMeter.apk"
          else
            echo "ERROR: Output arm64-v8a APK not found!" >&2
            exit 1
          fi

          if [ -f "$V7A_APK" ]; then
            cp -v "$V7A_APK" apk_dist/ICarMeter-armeabi-v7a.apk
            echo "Packaged v7a APK -> apk_dist/ICarMeter-armeabi-v7a.apk"
          else
            echo "ERROR: Output armeabi-v7a APK not found!" >&2
            exit 1
          fi

          echo "=== Packaged APKs ==="
          ls -lah apk_dist/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v6
        with:
          name: icarmeter-apk
          path: apk_dist/
          retention-days: 7

  # ==============================================================================
  # Job 2: Build Rust Binary for Raspberry Pi (aarch64)
  # ==============================================================================
  build-binary:
    name: Build Cargo Binary (aarch64)
    needs: [resolve-version]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install cross-compilation linker
        run: |
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu pkg-config \
            libcurl4-openssl-dev:arm64 libegl1-mesa-dev:arm64 libgl-dev:arm64 \
            libicu-dev:arm64 libjpeg-turbo8-dev:arm64 libpng-dev:arm64 \
            libssl-dev:arm64 libuv1-dev:arm64 libwebp-dev:arm64 zlib1g-dev:arm64

      - name: Build ICarMeter for aarch64
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
          PKG_CONFIG_ALLOW_CROSS: "1"
          PKG_CONFIG_PATH: /usr/lib/aarch64-linux-gnu/pkgconfig
          APP_VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re

          manifest = Path("Cargo.toml")
          contents = manifest.read_text()
          package_section = re.search(r"(?ms)^\[package\]\s*(.*?)(?=^\[|\Z)", contents)
          if package_section is None:
              raise SystemExit("Cargo.toml has no [package] section")

          section = package_section.group(1)
          section, replacements = re.subn(
              r'(?m)^version\s*=\s*"[^"]+"\s*$',
              f'version = "{os.environ["APP_VERSION"]}"',
              section,
              count=1,
          )
          if replacements != 1:
              raise SystemExit("Could not set [package].version in Cargo.toml")

          start, end = package_section.span(1)
          manifest.write_text(contents[:start] + section + contents[end:])
          print(f"Building Rust package version {os.environ['APP_VERSION']}")
          PY
          cargo build --release --target aarch64-unknown-linux-gnu

      - name: Verify compiled binary
        run: |
          ls -lah target/aarch64-unknown-linux-gnu/release/car_dashboard
          file target/aarch64-unknown-linux-gnu/release/car_dashboard

      - name: Stage binary artifact
        run: |
          mkdir -p dist_bin
          cp target/aarch64-unknown-linux-gnu/release/car_dashboard dist_bin/
          ls -lah dist_bin/

      - name: Upload compiled binary artifact
        uses: actions/upload-artifact@v6
        with:
          name: car_dashboard-bin
          path: dist_bin/
          retention-days: 7

  # ==============================================================================
  # Job 3: Build Custom Raspberry Pi OS Image (pi-gen)
  # ==============================================================================
  build-image:
    name: Build Pi OS Image (arm64)
    needs: [build-binary]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Free disk space on runner
        run: |
          echo "Initial disk space:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune -a -f || true
          echo "Cleaned disk space:"
          df -h

      - name: Download compiled binary artifact
        uses: actions/download-artifact@v6
        with:
          name: car_dashboard-bin
          path: bin_artifact/

      - name: Inject binary into stage-icarmeter files
        run: |
          mkdir -p pi-image/stage-icarmeter/02-app-install/files
          find bin_artifact -type f -name "car_dashboard" -exec cp -v {} pi-image/stage-icarmeter/02-app-install/files/car_dashboard \;
          chmod +x pi-image/stage-icarmeter/02-app-install/files/car_dashboard
          ls -lah pi-image/stage-icarmeter/02-app-install/files/

      - name: Setup QEMU and binfmt
        run: |
          docker run --privileged --rm tonistiigi/binfmt --install all

      - name: Build Pi OS Image with pi-gen Docker
        run: |
          cd pi-image
          chmod -R +x .
          find . -type f \( -name "*.sh" -o -name "EXPORT_IMAGE" \) -exec chmod +x {} + || true
          ./build-docker.sh

      - name: Package Image into Flashable Zip
        run: |
          mkdir -p image_dist
          cd pi-image/deploy

          IMG_FILE=$(ls *.img 2>/dev/null | head -n 1)
          if [ -z "$IMG_FILE" ]; then
            echo "ERROR: No .img file found in deploy/!" >&2
            exit 1
          fi

          echo "Found image: ${IMG_FILE}"
          ZIP_NAME="ICarMeter-RaspberryPiOS-arm64.zip"

          # Package ONLY the .img file into the zip archive so Raspberry Pi Imager / BalenaEtcher can flash directly
          zip -6 -j "../../image_dist/${ZIP_NAME}" "${IMG_FILE}"

          # Copy info file to artifact for build details
          cp -v *.info ../../image_dist/image_build.info 2>/dev/null || true

          echo "=== Output Zipped Artifact ==="
          ls -lah ../../image_dist/

      - name: Upload Image Artifact
        uses: actions/upload-artifact@v6
        with:
          name: icarmeter-image-zip
          path: image_dist/
          retention-days: 7

  # ==============================================================================
  # Job 4: Publish GitHub Release (Both Image Zip & APK)
  # ==============================================================================
  publish-release:
    name: Publish GitHub Release (OS Image & APK)
    needs: [resolve-version, build-apk, build-binary, build-image]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create release assets directory
        run: mkdir -p release_assets

      - name: Download APK artifact
        uses: actions/download-artifact@v6
        with:
          name: icarmeter-apk
          path: release_assets/

      - name: Download OS Image artifact
        uses: actions/download-artifact@v6
        with:
          name: icarmeter-image-zip
          path: release_assets/

      - name: Flatten assets and compute unified SHA256 checksums
        working-directory: release_assets
        run: |
          find . -mindepth 2 -type f -exec mv -v {} . \; || true
          rm -f SHA256SUMS.txt
          sha256sum ICarMeter-arm64-v8a.apk ICarMeter-armeabi-v7a.apk ICarMeter.apk ICarMeter-RaspberryPiOS-arm64.zip 2>/dev/null | tee SHA256SUMS.txt || true
          echo "=== Release Assets Ready ==="
          ls -lah

      - name: Resolve Release Tag & Name
        id: rel_meta
        env:
          RESOLVED_TAG: ${{ needs.resolve-version.outputs.tag }}
          INPUT_RELEASE_NAME: ${{ github.event.inputs.release_name }}
        run: |
          if [ -n "$INPUT_RELEASE_NAME" ]; then
            TITLE="$INPUT_RELEASE_NAME"
          else
            TITLE="ICarMeter ${RESOLVED_TAG}"
          fi

          echo "tag=${RESOLVED_TAG}" >> $GITHUB_OUTPUT
          echo "title=${TITLE}" >> $GITHUB_OUTPUT

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.rel_meta.outputs.tag }}
          name: ${{ steps.rel_meta.outputs.title }}
          draft: ${{ github.event.inputs.draft == true }}
          prerelease: ${{ github.event.inputs.prerelease == true }}
          files: |
            release_assets/ICarMeter-arm64-v8a.apk
            release_assets/ICarMeter-armeabi-v7a.apk
            release_assets/ICarMeter.apk
            release_assets/ICarMeter-RaspberryPiOS-arm64.zip
            release_assets/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            ## ICarMeter Release ${{ steps.rel_meta.outputs.tag }}

            ### Tệp tải về / Downloads:
            - **ICarMeter-arm64-v8a.apk**: Ứng dụng Android tối ưu cho thiết bị 64-bit (ARM64 / v8a)
            - **ICarMeter-armeabi-v7a.apk**: Ứng dụng Android cho thiết bị 32-bit (ARM32 / v7a)
            - **ICarMeter.apk**: Bản phát hành mặc định (arm64-v8a)
            - **ICarMeter-RaspberryPiOS-arm64.zip**: Hệ điều hành Raspberry Pi OS cho ICarMeter
            - **SHA256SUMS.txt**: Mã băm SHA256 để kiểm tra tính toàn vẹn của tệp tải về.
