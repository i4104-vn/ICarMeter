name: Build & Release ICarMeter (OS Image & Android APK)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release Tag (e.g. v1.0.0)"
        required: false
        default: ""
        type: string
      release_name:
        description: "Release Title (e.g. ICarMeter v1.0.0)"
        required: false
        default: ""
        type: string
      draft:
        description: "Create Draft Release"
        required: false
        default: false
        type: boolean
      prerelease:
        description: "Mark as Pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ==============================================================================
  # Job 1: Build the Android APKs for 32-bit and 64-bit ARM
  # ==============================================================================
  build-apk:
    name: Build Android Companion APK (Flutter)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Java JDK 17
        uses: actions/setup-java@v6.1.0
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: "stable"
          cache: true
          pub-cache: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Get Flutter Dependencies
        working-directory: mobile-app
        run: flutter pub get --enforce-lockfile

      - name: Android Release APK
        working-directory: mobile-app
        run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64

      - name: Package Release APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apk_dist
          APK_DIR=mobile-app/build/app/outputs/flutter-apk
          cp -v "$APK_DIR/app-arm64-v8a-release.apk" apk_dist/ICarMeter-arm64-v8a.apk
          cp -v "$APK_DIR/app-arm64-v8a-release.apk" apk_dist/ICarMeter.apk
          cp -v "$APK_DIR/app-armeabi-v7a-release.apk" apk_dist/ICarMeter-armeabi-v7a.apk
          ls -lah apk_dist/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: icarmeter-apk
          path: apk_dist/
          retention-days: 7

  # ==============================================================================
  # Job 2: Build Rust Binary for Raspberry Pi (aarch64)
  # ==============================================================================
  build-binary:
    name: Build Cargo Binary (aarch64)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2.9.2

      - name: Install cross-compilation linker
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu

      - name: Build ICarMeter for aarch64
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          cargo build --locked --release --target aarch64-unknown-linux-gnu

      - name: Verify compiled binary
        run: |
          ls -lah target/aarch64-unknown-linux-gnu/release/car_dashboard
          file target/aarch64-unknown-linux-gnu/release/car_dashboard

      - name: Stage binary artifact
        run: |
          mkdir -p dist_bin
          cp target/aarch64-unknown-linux-gnu/release/car_dashboard dist_bin/
          cp config.toml dist_bin/
          ls -lah dist_bin/

      - name: Upload compiled binary artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: car_dashboard-bin
          path: dist_bin/
          retention-days: 7

  # ==============================================================================
  # Job 3: Build Custom Raspberry Pi OS Image (pi-gen)
  # ==============================================================================
  build-image:
    name: Build Pi OS Image (arm64)
    needs: [build-binary]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space on runner
        run: |
          echo "Initial disk space:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune -a -f || true
          echo "Cleaned disk space:"
          df -h

      - name: Download compiled binary artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: car_dashboard-bin
          path: bin_artifact/

      - name: Inject binary into stage-icarmeter files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pi-image/stage-icarmeter/02-app-install/files
          cp -v bin_artifact/car_dashboard pi-image/stage-icarmeter/02-app-install/files/car_dashboard
          cp -v bin_artifact/config.toml pi-image/stage-icarmeter/02-app-install/files/config.toml
          chmod +x pi-image/stage-icarmeter/02-app-install/files/car_dashboard
          ls -lah pi-image/stage-icarmeter/02-app-install/files/

      - name: Build Pi OS Image with pi-gen Docker
        shell: bash
        run: |
          set -euo pipefail
          cd pi-image
          chmod +x build-docker.sh
          ./build-docker.sh

      - name: Package Image into Flashable Zip
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p image_dist
          cd pi-image/deploy

          shopt -s nullglob
          images=( *.img )
          if [ "${#images[@]}" -ne 1 ]; then
            printf 'ERROR: Expected one .img file, found %s.\n' "${#images[@]}" >&2
            ls -lah
            exit 1
          fi
          IMG_FILE=${images[0]}

          echo "Found image: ${IMG_FILE}"
          ZIP_NAME="ICarMeter-RaspberryPiOS-arm64.zip"

          # Package ONLY the .img file into the zip archive so Raspberry Pi Imager / BalenaEtcher can flash directly
          zip -6 -j "../../image_dist/${ZIP_NAME}" "${IMG_FILE}"

          echo "=== Output Zipped Artifact ==="
          ls -lah ../../image_dist/

      - name: Upload Image Artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: icarmeter-image-zip
          path: image_dist/
          retention-days: 7

  # ==============================================================================
  # Job 4: Publish GitHub Release (Both Image Zip & APK)
  # ==============================================================================
  publish-release:
    name: Publish GitHub Release (OS Image & APK)
    needs: [build-apk, build-binary, build-image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: icarmeter-apk
          path: release_assets/apk/

      - name: Download OS Image artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: icarmeter-image-zip
          path: release_assets/image/

      - name: Prepare release assets and compute SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cp release_assets/apk/ICarMeter-arm64-v8a.apk release_assets/
          cp release_assets/apk/ICarMeter-armeabi-v7a.apk release_assets/
          cp release_assets/apk/ICarMeter.apk release_assets/
          cp release_assets/image/ICarMeter-RaspberryPiOS-arm64.zip release_assets/
          (
            cd release_assets
            sha256sum ICarMeter-arm64-v8a.apk ICarMeter-armeabi-v7a.apk ICarMeter.apk ICarMeter-RaspberryPiOS-arm64.zip > SHA256SUMS.txt
            ls -lah
          )

      - name: Resolve Release Tag & Name
        id: rel_meta
        env:
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
          INPUT_RELEASE_NAME: ${{ inputs.release_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_TAG_NAME" ]; then
            TAG="$INPUT_TAG_NAME"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v1.0.0-build.${RUN_NUMBER}"
          fi

          if [ -n "$INPUT_RELEASE_NAME" ]; then
            TITLE="$INPUT_RELEASE_NAME"
          else
            TITLE="ICarMeter ${TAG}"
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "title=${TITLE}" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ steps.rel_meta.outputs.tag }}
          name: ${{ steps.rel_meta.outputs.title }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          files: |
            release_assets/ICarMeter-arm64-v8a.apk
            release_assets/ICarMeter-armeabi-v7a.apk
            release_assets/ICarMeter.apk
            release_assets/ICarMeter-RaspberryPiOS-arm64.zip
            release_assets/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            ## ICarMeter Release ${{ steps.rel_meta.outputs.tag }}

            ### Tệp tải về / Downloads:
            - **ICarMeter-arm64-v8a.apk**: Ứng dụng Android tối ưu cho thiết bị 64-bit (ARM64 / v8a) - Điện thoại hiện đại & màn hình Android ô tô
            - **ICarMeter-armeabi-v7a.apk**: Ứng dụng Android cho thiết bị 32-bit (ARM32 / v7a)
            - **ICarMeter.apk**: Bản phát hành mặc định (arm64-v8a)
            - **ICarMeter-RaspberryPiOS-arm64.zip**: Hệ điều hành Raspberry Pi OS cho ICarMeter
            - **SHA256SUMS.txt**: Mã băm SHA256 để kiểm tra tính toàn vẹn của tệp tải về.
