name: Build & Release ICarMeter (OS Image)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Application version (e.g. 1.2.3 or 1.2.3-rc.1)"
        required: true
        type: string
      tag_name:
        description: "Release Tag (e.g. v1.0.0)"
        required: false
        default: ""
        type: string
      release_name:
        description: "Release Title (e.g. ICarMeter v1.0.0)"
        required: false
        default: ""
        type: string
      draft:
        description: "Create Draft Release"
        required: false
        default: false
        type: boolean
      prerelease:
        description: "Mark as Pre-release"
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # ==============================================================================
  # Job 0: Resolve Version and Tag
  # ==============================================================================
  resolve-version:
    name: Resolve Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Resolve and validate version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
          GIT_REF: ${{ github.ref }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys

          input_version = os.environ.get("INPUT_VERSION", "").strip()
          input_tag = os.environ.get("INPUT_TAG_NAME", "").strip()
          git_ref = os.environ.get("GIT_REF", "").strip()

          if input_version:
              version = input_version.removeprefix("v")
          elif input_tag:
              version = input_tag.removeprefix("v")
          elif git_ref.startswith("refs/tags/"):
              version = git_ref.removeprefix("refs/tags/").removeprefix("v")
          else:
              print("ERROR: Version or tag must be provided.", file=sys.stderr)
              sys.exit(1)

          if not re.match(r"^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$", version):
              print(f"ERROR: Invalid semantic version '{version}'", file=sys.stderr)
              sys.exit(1)

          tag = input_tag if input_tag else f"v{version}"

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"version={version}\n")
              f.write(f"tag={tag}\n")

          print(f"Target version: {version} (tag: {tag})")
          PY

  # ==============================================================================
  # Job 1: Build Rust Binary for Raspberry Pi (Debian Bookworm ARM64)
  # ==============================================================================
  build-binary:
    name: Build Cargo Binary (aarch64)
    needs: [resolve-version]
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Cargo Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-aarch64-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-aarch64-

      - name: Build ICarMeter binary
        env:
          APP_VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re

          manifest = Path("Cargo.toml")
          contents = manifest.read_text()
          section = re.search(r"(?ms)^\[package\]\s*(.*?)(?=^\[|\Z)", contents)
          if section is None:
              raise SystemExit("Cargo.toml missing [package] section")

          new_pkg = re.sub(
              r'(?m)^version\s*=\s*"[^"]+"\s*$',
              f'version = "{os.environ["APP_VERSION"]}"',
              section.group(1),
              count=1
          )
          start, end = section.span(1)
          manifest.write_text(contents[:start] + new_pkg + contents[end:])
          print(f"Updated Cargo.toml version -> {os.environ['APP_VERSION']}")
          PY

          # Ensure host cargo directories exist for volume mounting
          mkdir -p ~/.cargo/registry ~/.cargo/git target

          # Build inside Debian Bookworm arm64 for ABI compatibility with Raspberry Pi rootfs.
          # Mount host cargo cache to avoid redownloading and recompiling untouched crates.
          docker run --rm --platform linux/arm64 \
            -v "$GITHUB_WORKSPACE:/src" \
            -v "$HOME/.cargo/registry:/usr/local/cargo/registry" \
            -v "$HOME/.cargo/git:/usr/local/cargo/git" \
            -w /src \
            rust:bookworm \
            bash -euo pipefail -c '
              apt-get update
              apt-get install -y --no-install-recommends \
                ca-certificates gcc g++ pkg-config \
                libinput-dev libseat-dev libudev-dev libxkbcommon-dev
              cargo build --release --target aarch64-unknown-linux-gnu
            '

          # Fix permissions from container build so actions/cache can save target/ and .cargo/
          sudo chown -R $USER:$USER ~/.cargo target/ 2>/dev/null || true

      - name: Stage compiled binary
        run: |
          mkdir -p dist_bin
          BIN_PATH="target/aarch64-unknown-linux-gnu/release/icarmeter"
          if [ -z "$BIN_PATH" ]; then
            echo "ERROR: Compiled binary not found in target/aarch64-unknown-linux-gnu/release" >&2
            exit 1
          fi
          echo "Found compiled binary: $BIN_PATH"
          cp -v "$BIN_PATH" dist_bin/icarmeter
          chmod +x dist_bin/icarmeter
          ls -lah dist_bin/
          file dist_bin/icarmeter

      - name: Upload compiled binary artifact
        uses: actions/upload-artifact@v6
        with:
          name: icarmeter-bin
          path: dist_bin/
          retention-days: 7

  # ==============================================================================
  # Job 3: Build Custom Raspberry Pi OS Image (pi-gen)
  # ==============================================================================
  build-image:
    name: Build Pi OS Image (arm64)
    needs: [build-binary]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Fast disk cleanup
        run: |
          echo "Initial disk space:"
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL &
          sudo docker image prune -a -f &
          wait
          echo "Cleaned disk space:"
          df -h

      - name: Download compiled binary artifact
        uses: actions/download-artifact@v6
        with:
          name: icarmeter-bin
          path: bin_artifact/

      - name: Inject binary into stage-icarmeter
        run: |
          mkdir -p pi-image/stage-icarmeter/02-app-install/files
          cp -v bin_artifact/icarmeter pi-image/stage-icarmeter/02-app-install/files/icarmeter
          chmod +x pi-image/stage-icarmeter/02-app-install/files/icarmeter
          ls -lah pi-image/stage-icarmeter/02-app-install/files/

      - name: Setup QEMU and binfmt
        run: |
          docker run --privileged --rm tonistiigi/binfmt --install all

      - name: Build Pi OS Image with pi-gen Docker
        run: |
          cd pi-image
          chmod -R +x .
          find . -type f \( -name '*.sh' -o -name 'EXPORT_IMAGE' \) -exec chmod +x {} + || true
          ./build-docker.sh

      - name: Package Image into Flashable Zip
        run: |
          mkdir -p image_dist
          cd pi-image/deploy

          IMG_FILE=$(ls *.img 2>/dev/null | head -n 1)
          if [ -z "$IMG_FILE" ]; then
            echo "ERROR: No .img file found in deploy/!" >&2
            exit 1
          fi

          echo "Found image: ${IMG_FILE}"
          ZIP_NAME="ICarMeter-RaspberryPiOS-arm64.zip"

          # Fast multi-threaded compression utilizing all runner CPU cores
          if command -v 7z >/dev/null 2>&1; then
            echo "Compressing with multi-threaded 7z..."
            7z a -tzip -mx=4 -mmt=on "../../image_dist/${ZIP_NAME}" "${IMG_FILE}"
          else
            echo "Compressing with zip (fast level 1)..."
            zip -1 -j "../../image_dist/${ZIP_NAME}" "${IMG_FILE}"
          fi

          cp -v *.info ../../image_dist/image_build.info 2>/dev/null || true
          ls -lah ../../image_dist/

      - name: Upload Image Artifact
        uses: actions/upload-artifact@v6
        with:
          name: icarmeter-image-zip
          path: image_dist/
          retention-days: 7

  # ==============================================================================
  # Job 3: Publish GitHub Release (OS Image Zip)
  # ==============================================================================
  publish-release:
    name: Publish GitHub Release
    needs: [resolve-version, build-image]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create release assets directory
        run: mkdir -p release_assets

      - name: Download OS Image artifact
        uses: actions/download-artifact@v6
        with:
          name: icarmeter-image-zip
          path: release_assets/

      - name: Flatten assets and compute unified SHA256 checksums
        working-directory: release_assets
        run: |
          find . -mindepth 2 -type f -exec mv -v {} . \; || true
          rm -f SHA256SUMS.txt
          sha256sum ICarMeter-RaspberryPiOS-arm64.zip 2>/dev/null | tee SHA256SUMS.txt || true
          echo "=== Release Assets Ready ==="
          ls -lah

      - name: Resolve Release Title
        id: rel_meta
        env:
          RESOLVED_TAG: ${{ needs.resolve-version.outputs.tag }}
          INPUT_RELEASE_NAME: ${{ github.event.inputs.release_name }}
        run: |
          if [ -n "$INPUT_RELEASE_NAME" ]; then
            TITLE="$INPUT_RELEASE_NAME"
          else
            TITLE="ICarMeter ${RESOLVED_TAG}"
          fi
          echo "title=${TITLE}" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve-version.outputs.tag }}
          name: ${{ steps.rel_meta.outputs.title }}
          draft: ${{ github.event.inputs.draft == true }}
          prerelease: ${{ github.event.inputs.prerelease == true }}
          files: |
            release_assets/ICarMeter-RaspberryPiOS-arm64.zip
            release_assets/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            ## ICarMeter Release ${{ needs.resolve-version.outputs.tag }}

            ### Tệp tải về / Downloads:
            - **ICarMeter-RaspberryPiOS-arm64.zip**: Hệ điều hành Raspberry Pi OS cho ICarMeter
            - **SHA256SUMS.txt**: Mã băm SHA256 để kiểm tra tính toàn vẹn của tệp tải về.

